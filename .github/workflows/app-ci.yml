name: App CI


on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Detect backend
        id: detect
        run: |
          if [ -f backend/pyproject.toml ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "No backend yet, skipping"; fi
      - uses: actions/setup-python@v5
        if: steps.detect.outputs.found == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        if: steps.detect.outputs.found == 'true'
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Ruff lint
        if: steps.detect.outputs.found == 'true'
        working-directory: backend
        run: ruff check .
      - name: Ruff format check
        if: steps.detect.outputs.found == 'true'
        working-directory: backend
        run: ruff format --check .
      - name: mypy
        if: steps.detect.outputs.found == 'true'
        working-directory: backend
        run: mypy .
      - name: pytest
        if: steps.detect.outputs.found == 'true'
        working-directory: backend
        run: pytest

  frontend:
    name: Frontend (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Detect frontend
        id: detect
        run: |
          if [ -f frontend/package.json ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "No frontend yet, skipping"; fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.found == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        if: steps.detect.outputs.found == 'true'
        working-directory: frontend
        run: npm ci
      - name: Lint
        if: steps.detect.outputs.found == 'true'
        working-directory: frontend
        run: npm run lint
      - name: Type check
        if: steps.detect.outputs.found == 'true'
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Test
        if: steps.detect.outputs.found == 'true'
        working-directory: frontend
        run: npm test --if-present
